name: Validate standard release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Standard release tag to verify
        required: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned release validator
        run: python -m pip install git+https://github.com/retro-trans/retro-trans-tools.git@v0.2.0
      - name: Check uploaded assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: python tools/validate_release.py "$RELEASE_TAG"
